<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판다 수학 탐험</title>
<meta name="theme-color" content="#2f7d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="판다 수학">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one play column — status strip, 8×8 bamboo-forest board, d-pad, unit picker, dress-up shop; quiz opens as a full-screen card */
:root{
  color-scheme: light;
  --sky:#eaf4e1;
  --grass-a:#bfe0a6;
  --grass-b:#b2d797;
  --leaf:#2f7d3a;
  --leaf-soft:#d3ebc3;
  --ink:#1f2a22;
  --card:#ffffff;
  --gold:#f2b51d;
  --gold-deep:#a8760a;
  --right:#3e9b4a;
  --miss:#d9534f;
  --muted:#5b6b5e;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold-deep);outline-offset:3px}
.off{display:none!important}

/* one-screen app: everything fits the phone without scrolling */
html{height:100%;box-sizing:border-box}
body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{height:100%;max-width:560px;margin:0 auto;padding-inline:14px;padding-block:10px 12px;display:flex;flex-direction:column;gap:8px}
.board-wrap{flex:1 1 auto;min-height:0;display:grid;place-items:center;container-type:size}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top{flex-wrap:nowrap}
.top h1 span{color:var(--leaf)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 6px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink)}
.coin-ico{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,var(--gold) 55%,var(--gold-deep));border:2px solid var(--gold-deep);display:inline-grid;place-items:center;font-size:13px;color:var(--gold-deep);font-family:var(--display)}
.pill.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.15)}}
.icon-btn{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.icon-btn svg{width:22px;height:22px}

.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.chip{font-family:var(--display);font-size:16px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.stage{background:var(--leaf);color:#fff}
.streak{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.streak i{width:12px;height:12px;border-radius:50%;background:var(--leaf-soft);border:2px solid var(--ink);display:inline-block}
.streak i.on{background:var(--gold)}

.msg{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:4px 12px;font-family:var(--display);font-size:16px;line-height:1.35;min-height:calc(2.7em + 8px);display:flex;align-items:center}

/* board */
.board{position:relative;width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:var(--grass-a);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@supports (width:1cqw){ .board{width:calc(min(100cqw,100cqh) - 6px)} }
.cells{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.cell{position:relative;background:var(--grass-a);cursor:pointer}
.cell.b{background:var(--grass-b)}
.cell svg{position:absolute;left:8%;top:8%;width:84%;height:84%;overflow:visible}
.cell.coin svg{animation:bob 1.6s ease-in-out infinite}
.cell.box svg,.cell.star svg{animation:glow 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8%)}}
@keyframes glow{50%{transform:scale(1.06)}}
.cell.pop svg{animation:popcell .5s ease}
@keyframes popcell{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

.panda{position:absolute;left:0;top:0;width:12.5%;height:12.5%;z-index:2;pointer-events:none;transition:transform .16s linear}
.panda .inner{position:absolute;inset:0}
.panda .inner.flip svg{transform:scaleX(-1)}
.panda svg{position:absolute;left:-14%;bottom:2%;width:128%;height:auto;overflow:visible}
.panda .inner.hop{animation:hop .16s ease}
.panda .inner.bump{animation:bump .25s ease}
.panda .inner.cheer{animation:cheer .6s ease}
.panda .inner.shake{animation:shake .45s ease}
@keyframes hop{50%{transform:translateY(-14%)}}
@keyframes bump{40%{transform:translateX(8%)}}
@keyframes cheer{30%{transform:translateY(-30%) scale(1.1)}60%{transform:translateY(0)}}
@keyframes shake{25%,75%{transform:translateX(-8%)}50%{transform:translateX(8%)}}

/* overlays */
.overlay{position:absolute;inset:0;z-index:5;background:rgba(31,42,34,.45);display:flex;overflow-y:auto;padding:14px}
#quiz{position:fixed;z-index:20}
.qcard{margin:auto;width:100%;max-width:420px;background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.qcard .tag{align-self:center;font-family:var(--display);font-size:14px;background:var(--leaf-soft);border-radius:999px;padding:2px 12px;text-align:center}
.qcard .tag.star{background:#fde59a}
.qcard .tag.review{background:#fde4c4}
.qtext{font-family:var(--display);font-size:20px;line-height:1.45;text-align:center;text-wrap:balance}
.qfig{display:flex;justify-content:center}
.fig{display:block;width:100%;max-width:260px;height:auto}
.fig text{font-family:var(--display);font-size:16px;fill:var(--ink)}
.q{font-family:var(--display);font-size:clamp(32px,10vw,52px);line-height:1.15;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.q.mid{font-size:clamp(21px,6.4vw,30px);white-space:normal}
.q .ans{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--ink);color:var(--leaf)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.78em;margin:0 .12em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.mx{white-space:nowrap}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.long .choice{font-size:20px}
.choices.one{grid-template-columns:1fr}
.choice{font-family:var(--display);font-size:clamp(24px,7vw,30px);font-variant-numeric:tabular-nums;padding:8px 10px 8px 24px;border-radius:16px;border:3px solid var(--ink);background:#f6fbf1;box-shadow:0 4px 0 var(--ink);position:relative;transition:transform .08s,box-shadow .08s;line-height:1.25}
.choice:hover{background:var(--leaf-soft)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice .key{position:absolute;left:8px;top:3px;font-family:var(--body);font-size:11px;color:var(--muted)}
.choice.right{background:var(--right);color:#fff}
.choice.wrong{background:var(--miss);color:#fff}
.choice.right .key,.choice.wrong .key{color:#fff;opacity:.8}
.choice:disabled{cursor:default}
.feedback{font-size:15px;text-align:center;min-height:1.5em;color:var(--muted);line-height:1.6}
.feedback b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.feedback .explain{display:block;margin-top:6px;background:#f3f8ee;border-radius:12px;padding:8px 10px;color:var(--ink);text-align:left}
.okbtn{align-self:center}
.combo{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-family:var(--display);font-size:30px;color:var(--gold);-webkit-text-stroke:1.5px var(--ink);white-space:nowrap;animation:combo 1.2s ease forwards;pointer-events:none}
@keyframes combo{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}

/* picture graph */
.pg{display:flex;flex-direction:column;gap:6px;border:2px solid var(--leaf-soft);border-radius:12px;padding:8px 10px;min-width:220px}
.pg-row{display:flex;align-items:center;gap:8px}
.pg-lab{font-family:var(--display);width:3.2em;flex:none}
.pg-icons{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.cb,.cs{display:inline-block;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,var(--gold) 55%,var(--gold-deep));border:2px solid var(--gold-deep)}
.cb{width:24px;height:24px}
.cs{width:13px;height:13px}
.pg-key{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--leaf-soft);padding-top:6px}

.clearcard{text-align:center;align-items:center}
.clearcard h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--leaf)}
.clearcard p{margin:0}
.bigbtn{font-family:var(--display);font-size:22px;border:3px solid var(--ink);border-radius:999px;padding:6px 26px;background:var(--gold);box-shadow:0 4px 0 var(--ink)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* bottom bar: unit sheet · d-pad · shop sheet */
.bottom{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{justify-self:center;position:relative;width:68px;height:68px;border-radius:20px;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-family:var(--display);font-size:15px}
.side svg{width:26px;height:26px}
.side:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.side .dot{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--miss);border:3px solid var(--card)}
.hint b{font-family:var(--display);font-weight:400;color:var(--ink)}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:4px}
.dpad button{border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.dpad button:active,.dpad button.held{transform:translateY(3px);box-shadow:0 0 0 var(--ink);background:var(--leaf-soft)}
.dpad svg{width:24px;height:24px}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}

/* bottom sheets (units, shop) */
.sheet-back{position:fixed;inset:0;z-index:14;background:rgba(31,42,34,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:560px;margin:0 auto;max-height:82%;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding-inline:16px;padding-block:12px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sheet .sub{margin:0;font-size:14px;color:var(--muted)}
.close{font-family:var(--display);font-size:16px;border:2px solid var(--ink);border-radius:999px;padding:4px 16px;background:var(--leaf-soft)}
.help{margin:0;font-size:14px;color:var(--muted);background:#f3f8ee;border-radius:12px;padding:8px 12px}
.help b{font-family:var(--display);font-weight:400;color:var(--ink)}
.units{display:flex;flex-wrap:wrap;gap:8px}
.tbl{font-family:var(--display);font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:4px 12px;background:#fff}
.tbl[aria-pressed="true"]{background:var(--leaf);color:#fff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{display:grid;grid-template-columns:44px 1fr;column-gap:10px;align-items:center;border:2px solid var(--leaf-soft);border-radius:16px;padding:8px 10px;background:#f8fcf4}
.item.equipped{border-color:var(--leaf);background:#eef8e6}
.item svg{grid-row:1 / span 2;width:44px;height:44px}
.item .nm{font-family:var(--display);font-size:16px;line-height:1.2;min-width:0}
.item button{justify-self:start;margin-top:4px;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-family:var(--display);font-size:15px;background:var(--gold);display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.item button .mini{width:14px;height:14px;border-radius:50%;background:#ffe58a;border:2px solid var(--gold-deep)}
.item button.poor{background:#eee;color:#8a8f8b;border-color:#b9bfba;cursor:not-allowed}
.item button.poor .mini{border-color:#b9bfba;background:#f4f4f4}
.item button.wear{background:var(--leaf-soft)}
.item button.on{background:var(--leaf);color:#fff}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}

.flycoin{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,var(--gold) 55%,var(--gold-deep));border:2px solid var(--gold-deep);pointer-events:none;z-index:50}

.tbl{min-height:44px}
.choice{min-height:56px}
@media (max-width:400px){
  .qtext{font-size:18px}
  .top h1{font-size:19px}
  .pill{font-size:19px}
  .side{width:60px;height:62px;font-size:14px}
}
@media (max-height:640px){
  .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,38px)}
  .side{height:56px}
  .msg{font-size:14px}
}
/* phone turned sideways: map on the left, everything else on the right */
@media (orientation:landscape) and (max-height:540px){
  .app{max-width:none;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto 1fr auto;column-gap:16px;row-gap:8px}
  .board-wrap{grid-column:1;grid-row:1 / -1;height:100%;aspect-ratio:1;width:auto}
  .top,.status,.msg,.bottom{grid-column:2}
  .msg{align-self:start}
}
@media (prefers-reduced-motion:reduce){
  .cell svg,.panda .inner,.pill.pop{animation:none!important}
  .panda{transition:none}
}
</style>

<div class="app">
  <header class="top">
    <h1><span>판다</span> 수학 탐험</h1>
    <div class="pill" id="coinPill" aria-live="polite"><span class="coin-ico">₩</span><span id="coinNum">0</span></div>
    <button class="icon-btn" id="soundBtn" aria-label="소리 끄기" title="소리">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1f2a22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#1f2a22"/><path id="waveA" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="waveB" d="M19 6a8.5 8.5 0 0 1 0 12"/><path id="muteX" class="off" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
  </header>

  <div class="status">
    <span class="chip stage" id="stageChip">1단계</span>
    <span class="chip" id="boxChip">남은 상자 6</span>
    <span class="streak" id="streak" aria-label="연속 정답"></span>
  </div>

  <div class="msg" id="msg" aria-live="polite">지도를 손가락으로 밀거나 칸을 눌러서 ? 상자로 가 봐!</div>

  <div class="board-wrap">
  <div class="board" id="board" aria-label="대나무 숲 지도">
    <div class="cells" id="cells"></div>
    <div class="panda" id="panda">
      <div class="inner" id="pandaInner">
        <svg viewBox="0 0 220 240" aria-hidden="true">
          <ellipse cx="110" cy="230" rx="66" ry="9" fill="#1f2a22" opacity=".18"/>
          <ellipse cx="78" cy="208" rx="24" ry="19" fill="#1f2a22"/>
          <ellipse cx="142" cy="208" rx="24" ry="19" fill="#1f2a22"/>
          <ellipse cx="110" cy="165" rx="58" ry="55" fill="#ffffff" stroke="#1f2a22" stroke-width="5"/>
          <ellipse cx="60" cy="158" rx="17" ry="30" fill="#1f2a22" transform="rotate(25 60 158)"/>
          <ellipse cx="160" cy="158" rx="17" ry="30" fill="#1f2a22" transform="rotate(-25 160 158)"/>
          <g id="acc-bamboo" class="off">
            <rect x="168" y="84" width="14" height="136" rx="5" fill="#5aa64a" stroke="#1f2a22" stroke-width="4"/>
            <path d="M168 118h14M168 158h14M168 196h14" stroke="#2f6b2a" stroke-width="4"/>
            <path d="M182 102c12-11 25-9 31-4-10 8-21 9-31 4z" fill="#7cc35f" stroke="#1f2a22" stroke-width="3"/>
            <ellipse cx="172" cy="170" rx="13" ry="11" fill="#1f2a22"/>
          </g>
          <circle cx="62" cy="50" r="21" fill="#1f2a22"/>
          <circle cx="158" cy="50" r="21" fill="#1f2a22"/>
          <ellipse cx="110" cy="86" rx="63" ry="55" fill="#ffffff" stroke="#1f2a22" stroke-width="5"/>
          <ellipse cx="85" cy="85" rx="15" ry="20" fill="#1f2a22" transform="rotate(-22 85 85)"/>
          <ellipse cx="135" cy="85" rx="15" ry="20" fill="#1f2a22" transform="rotate(22 135 85)"/>
          <g id="eyes-open">
            <circle cx="87" cy="83" r="7" fill="#fff"/><circle cx="88.5" cy="84.5" r="4" fill="#1f2a22"/>
            <circle cx="133" cy="83" r="7" fill="#fff"/><circle cx="131.5" cy="84.5" r="4" fill="#1f2a22"/>
          </g>
          <g id="eyes-happy" class="off" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round">
            <path d="M79 87q8-10 16 0"/><path d="M125 87q8-10 16 0"/>
          </g>
          <path id="tear" class="off" d="M78 98q-6 10 0 13q6-3 0-13z" fill="#7cc4f2" stroke="#1f2a22" stroke-width="2"/>
          <ellipse cx="68" cy="106" rx="10" ry="6" fill="#f4a3a8" opacity=".8"/>
          <ellipse cx="152" cy="106" rx="10" ry="6" fill="#f4a3a8" opacity=".8"/>
          <ellipse cx="110" cy="101" rx="8" ry="5.5" fill="#1f2a22"/>
          <path id="mouth-normal" d="M101 110q9 8 18 0" fill="none" stroke="#1f2a22" stroke-width="4" stroke-linecap="round"/>
          <path id="mouth-happy" class="off" d="M99 108q11 18 22 0z" fill="#e2626a" stroke="#1f2a22" stroke-width="4" stroke-linejoin="round"/>
          <path id="mouth-sad" class="off" d="M101 117q9-8 18 0" fill="none" stroke="#1f2a22" stroke-width="4" stroke-linecap="round"/>
          <g id="acc-scarf" class="off">
            <rect x="122" y="136" width="18" height="38" rx="6" fill="#3b6fd8" stroke="#1f2a22" stroke-width="4" transform="rotate(-12 130 138)"/>
            <rect x="70" y="128" width="80" height="18" rx="9" fill="#3b6fd8" stroke="#1f2a22" stroke-width="4"/>
            <path d="M86 131v12M102 131v12M118 131v12M134 131v12" stroke="#fff" stroke-width="4" opacity=".85"/>
          </g>
          <g id="acc-glasses" class="off">
            <rect x="66" y="71" width="36" height="25" rx="9" fill="#2b3f55" stroke="#f4a3a8" stroke-width="5"/>
            <rect x="118" y="71" width="36" height="25" rx="9" fill="#2b3f55" stroke="#f4a3a8" stroke-width="5"/>
            <path d="M102 80q8-6 16 0" fill="none" stroke="#f4a3a8" stroke-width="5"/>

// turn {ans, wrongs} into 4 shuffled choices
function finish(o){
  const ans = String(o.ans); o.ans = ans;
  const set = new Set([ans]);
  for(const w of shuffle((o.wrongs || []).map(String))){
    if(set.size >= 4) break;

function carries(a,b){ let c=0,k=0; while(a||b){ const s=a%10+b%10+c; c=s>=10?1:0; k+=c; a=Math.floor(a/10); b=Math.floor(b/10);} return k; }
function borrows(a,b){ let br=0,k=0; while(a){ const d=a%10-b%10-br; br=d<0?1:0; k+=br; a=Math.floor(a/10); b=Math.floor(b/10);} return k; }
function noCarrySum(a,b){ let r=0,p=1; while(a>=10||b>=10){ r+=((a%10+b%10)%10)*p; p*=10; a=Math.floor(a/10); b=Math.floor(b/10);} return r+(a+b)*p; }
function noBorrowDiff(a,b){ let r=0,p=1; while(a||b){ r+=Math.abs(a%10-b%10)*p; p*=10; a=Math.floor(a/10); b=Math.floor(b/10);} return r; }
const d3 = n => [Math.floor(n/100), Math.floor(n/10)%10, n%10];
const ADDW = [

];

];
function genAdd(lv){
  const sub = Math.random() < .5;

    wr = [noCarrySum(a,b), ans+10, ans-10, ans+100, ans-100, ans+1];
    const [ah,at,ao] = d3(a), [bh,bt,bo] = d3(b);
    expl = `자리끼리 더해요: ${ah*100}+${bh*100}=${(ah+bh)*100}, ${at*10}+${bt*10}=${(at+bt)*10}, ${ao}+${bo}=${ao+bo}<br>→ ${(ah+bh)*100} + ${(at+bt)*10} + ${ao+bo} = ${ans}`;
  } else {
    const need = lv === 1 ? [0,1] : lv === 2 ? [1] : [2];

    const t = pick(sub ? SUBW : ADDW);

  }
  return finish({expr:`${a} ${op} ${b} = ${BLANK}`, ans, wrongs:wr, explain:expl});
}

/* ---- 곱셈 ---- */
const MLEVELS = [
  () => { const b = rand(2,4); if(Math.random() < .4) return [rand(1,9)*10, rand(2,9)]; const m = Math.floor(9/b); return [rand(1,m)*10 + rand(1,m), b]; },

function forgotCarry(a,b){ const ds = String(a).split('').reverse().map(Number); return ds.reduce((s,d,i) => s + (i === ds.length-1 ? d*b : (d*b)%10) * 10**i, 0); }
function mulExplain(a,b){
  const ans = a*b;
  if(b < 10){
    const ds = String(a).split('').map(Number), L = ds.length;
    const parts = ds.map((d,i) => d * 10**(L-1-i)).filter(p => p > 0);
    if(parts.length === 1){ const z = L-1, lead = a / 10**z; return `${lead}×${b}=${lead*b}에 0을 ${z}개 붙이면 ${ans}`; }
    return `${parts.map(p => p+'×'+b).join(' + ')} = ${parts.map(p => p*b).join(' + ')} = ${ans}`;
  }

const MULW = [

    const expl = `${d} × ${q} = ${a}이니까 ${a} ÷ ${d} = ${q}`;
    if(word){
      return finish({text:`사탕 ${a}개를 ${d}명에게 똑같이 나누어 주려고 해요. 한 명에게 몇 개씩 줄 수 있을까요?`, ans:q+'개', wrongs:[q+1,q-1,q+2,q+10,q-10,d].map(n => n+'개'), explain:expl});
    }
    return finish({expr:`${a} ÷ ${d} = ${BLANK}`, ans:q, wrongs:[q+1,q-1,q+2,q+10,q-10,d], explain:expl});
  }
  const pairs = [[q,r+1],[q+1,r],[q-1,r+d],[q,d-r],[q-1,r],[q+1,r+1]].filter(([x,y]) => !(x === q && y === r) && y >= 0 && x > 0);
  const expl = `${d} × ${q} = ${d*q}, ${a} − ${d*q} = ${r}<br>나머지는 나누는 수 ${d}보다 작아야 해요. 확인: ${d} × ${q} + ${r} = ${a}`;
  if(word){
    const f = (x,y) => `${x}주머니, ${y}개 남아요`;
    return finish({text:`구슬 ${a}개를 한 주머니에 ${d}개씩 담으면 몇 주머니가 되고, 몇 개가 남을까요?`, ans:f(q,r), wrongs:pairs.map(([x,y]) => f(x,y)), explain:expl});
  }
  const f = (x,y) => `몫 ${x}, 나머지 ${y}`;
  return finish({expr:`${a} ÷ ${d} = ${BLANK}`, ans:f(q,r), ansShow:`${q} … ${r}`, wrongs:pairs.map(([x,y]) => f(x,y)), explain:expl});
}

    return finish({expr:`${n}mm = ${BLANK}`, ans:`${c}cm ${m}mm`, wrongs:[`${Math.floor(n/100)}cm ${n%100}mm`, `${m}cm ${c}mm`, `${c+1}cm ${m}mm`, `${c}cm ${m+1}mm`, `${c-1}cm ${m}mm`], explain:`10mm = 1cm이에요. ${n}mm = ${c*10}mm + ${m}mm = ${c}cm ${m}mm`}); }
  if(t === 'km2m'){ const k = rand(1,9), m = pick([rand(1,9)*100, rand(1,9)*100 + rand(1,9)*10, rand(1,9)*10]), ans = k*1000+m;

  if(t === 'm2km'){ const k = rand(1,9), m = rand(1,99)*10, n = k*1000+m;
    return finish({expr:`${n}m = ${BLANK}`, ans:`${k}km ${m}m`, wrongs:[`${Math.floor(n/100)}km ${n%100}m`, `${k+1}km ${m}m`, `${k}km ${1000-m}m`, `${k-1}km ${m}m`, `${k}km ${m+100}m`], explain:`1000m = 1km예요. ${n}m = ${k*1000}m + ${m}m = ${k}km ${m}m`}); }
  if(t === 'min2s'){ const mm = rand(1,5), s = rand(5,55), ans = mm*60+s;
    return finish({expr:`${mm}분 ${s}초 = ${BLANK}초`, ans, wrongs:[mm*100+s, mm*10+s, ans+60, ans-60, ans+10], explain:`1분 = 60초이니까 ${mm}분 = ${mm*60}초<br>${mm*60}초 + ${s}초 = ${ans}초`}); }
  if(t === 's2min'){ let n; do { n = rand(70,330); } while(n % 60 === 0); const mm = Math.floor(n/60), s = n % 60;
    return finish({expr:`${n}초 = ${BLANK}`, ans:`${mm}분 ${s}초`, wrongs:[`${Math.floor(n/100)}분 ${n%100}초`, `${mm+1}분 ${s}초`, `${mm}분 ${s+10}초`, `${mm-1}분 ${s+60}초`], explain:`60초 = 1분이에요. ${n}초 = ${mm*60}초 + ${s}초 = ${mm}분 ${s}초`}); }
  if(t === 'tadd'){ const h1 = rand(1,4), h2 = rand(1,3), m1 = rand(5,11)*5, m2 = rand(Math.max(1, 13 - m1/5), 11)*5, sm = m1+m2;
    const ans = `${h1+h2+1}시간 ${sm-60}분`;
    return finish({expr:`${h1}시간 ${m1}분 + ${h2}시간 ${m2}분 = ${BLANK}`, ans, wrongs:[`${h1+h2}시간 ${sm}분`, `${h1+h2}시간 ${sm-60}분`, `${h1+h2+1}시간 ${sm-40}분`, `${h1+h2+2}시간 ${sm-60}분`], explain:`분끼리 더하면 ${m1}분 + ${m2}분 = ${sm}분 = 1시간 ${sm-60}분<br>시간끼리 더하면 ${h1+h2}시간 → 모두 ${ans}`}); }
  if(t === 'tsub'){ const H = rand(4,11), M = rand(1,7)*5, h2 = rand(1,H-2), m2 = rand(M/5+1, 11)*5;

}

function tone(f, s, d, type='sine', v=.16){

    const t = actx.currentTime + s, o = actx.createOscillator(), g = actx.createGain();

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.01); g.gain.exponentialRampToValueAtTime(.001, t+d);

  }catch(e){}
}

/* ---------- stage generation ---------- */
const idx = (x,y) => y*N + x;
const blocked = c => c.t === 'rock' || c.t === 'bamboo';
function reachableCount(cells, sx, sy){
  const seen = new Set([idx(sx,sy)]), q = [[sx,sy]];
  while(q.length){
    const [x,y] = q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy, k=idx(nx,ny);
      if(nx<0||ny<0||nx>=N||ny>=N||seen.has(k)||blocked(cells[k])) continue;
      seen.add(k); q.push([nx,ny]);
    }
  }
  return seen.size;
}
function newStage(){
  const s = S.stage;
  const nObs = Math.min(9 + s, 16), nBox = Math.min(5 + s, 10), nCoin = 6;
  const start = {x:0, y:N-1};
  let cells;
  for(let tries=0; tries<200; tries++){
    cells = Array.from({length:N*N}, () => ({t:'grass'}));
    const free = shuffle([...Array(N*N).keys()].filter(k => k !== idx(start.x,start.y) && k !== idx(1,N-1) && k !== idx(0,N-2)));
    for(let i=0;i<nObs;i++) cells[free[i]].t = Math.random() < .6 ? 'bamboo' : 'rock';
    if(reachableCount(cells, start.x, start.y) === cells.filter(c => !blocked(c)).length) break;
  }
  const open = shuffle([...Array(N*N).keys()].filter(k => cells[k].t === 'grass' && k !== idx(start.x,start.y)));
  let p = 0;
  for(let i=0;i<nBox;i++) cells[open[p++]].t = 'box';
  cells[open[p++]].t = 'star';
  for(let i=0;i<nCoin;i++) cells[open[p++]].t = 'coin';
  G = {cells, pos:{...start}, prev:{...start}, flip:false};
  renderBoard(); placePanda(true); renderStatus();
  say(`${s}단계! ? 상자 ${nBox}개와 ★ 별 상자를 모두 열어 봐.`);
}

    document.body.appendChild(c);
    const dx = x1-x0, dy = y1-y0;
    c.animate([{transform:'translate(0,0)'},{transform:`translate(${dx*.5}px,${dy*.5-60}px) scale(1.2)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.6)`}],{duration:650,easing:'ease-in-out'}).onfinish = () => c.remove();
  }, i*90);
}

/* ---------- movement ---------- */
const busy = () => quiz || openSheet || !$('clear').classList.contains('off');
const canEnter = (x,y) => x>=0 && y>=0 && x<N && y<N && !blocked(G.cells[idx(x,y)]);
function stepTo(x,y){
  const dx = x - G.pos.x;
  if(dx) G.flip = dx < 0;
  G.prev = {...G.pos}; G.pos = {x,y};
  placePanda(); anim('hop'); sfx.step();
  return land();
}
function land(){
  const k = idx(G.pos.x, G.pos.y), c = G.cells[k];
  if(c.t === 'coin'){
    c.t = 'grass'; renderCell(k); sfx.pick();
    S.coins += 2; renderCoins(true); renderShop(); save();
    say('반짝 동전 2개를 주웠어!');
    return true;
  }
  if(c.t === 'box' || c.t === 'star'){ walkQ = []; setTimeout(() => openQuiz(k), 180); return false; }
  return true;
}
function tryMove(dx,dy){
  if(busy()) return;
  const now = performance.now();
  if(now - lastMove < 120) return;
  lastMove = now; walkQ = [];
  const nx = G.pos.x + dx, ny = G.pos.y + dy;
  if(dx) G.flip = dx < 0;
  if(!canEnter(nx,ny)){
    placePanda(); anim('bump'); sfx.bump();
    if(nx>=0 && ny>=0 && nx<N && ny<N) say(G.cells[idx(nx,ny)].t === 'rock' ? '바위는 넘어갈 수 없어. 돌아가 보자!' : '대나무 숲이 너무 빽빽해. 다른 길로 가자!');
    return;
  }
  stepTo(nx,ny);
}
function findPath(tx,ty){
  const start = idx(G.pos.x,G.pos.y), goal = idx(tx,ty);
  const from = new Map([[start,-1]]), q = [start];
  while(q.length){
    const k = q.shift();
    if(k === goal) break;
    const x = k % N, y = Math.floor(k/N);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy, nk=idx(nx,ny);
      if(!canEnter(nx,ny) || from.has(nk)) continue;
      const t = G.cells[nk].t;
      if((t === 'box' || t === 'star') && nk !== goal) continue;
      from.set(nk,k); q.push(nk);
    }
  }
  if(!from.has(goal)) return null;
  const path = []; let k = goal;
  while(k !== start){ path.unshift([k % N, Math.floor(k/N)]); k = from.get(k); }
  return path;
}
function tapCell(k){
  if(busy() || performance.now() - swipedAt < 400) return;
  const x = k % N, y = Math.floor(k/N);
  if(x === G.pos.x && y === G.pos.y) return;
  if(blocked(G.cells[k])){ sfx.bump(); say('거기는 들어갈 수 없어. 풀밭이나 상자를 눌러 봐!'); return; }
  const path = findPath(x,y);
  if(!path){ say('그 칸까지 가는 길이 막혀 있어. 상자를 먼저 열어 봐!'); return; }
  walkQ = path;
  if(!walking) walkLoop();
}
function walkLoop(){
  if(!walkQ.length || busy()){ walking = false; return; }
  walking = true;
  const [x,y] = walkQ.shift();
  if(!stepTo(x,y)){ walking = false; return; }
  setTimeout(walkLoop, 170);
}

/* ---------- quiz ---------- */
function openQuiz(k){
  const star = G.cells[k].t === 'star';
  let Q, fromReview = false;
  if(!star && S.review.length && Math.random() < .4){ Q = S.review.shift(); Q.choices = shuffle(Q.choices.slice()); fromReview = true; }
  else Q = makeQuestion(star);
  quiz = {k, Q, star, gain: star ? 30 : 10, locked:false, wrong:false};
  sfx.open();
  const uname = UNITS.find(u => u.id === Q.unit)?.name || '';
  const tag = $('qtag');
  tag.textContent = star ? `★ 별 상자 · ${uname} · 동전 30개` : fromReview ? `아까 틀린 문제 · ${uname}` : `${uname} · 동전 10개`;
  tag.className = 'tag' + (star ? ' star' : fromReview ? ' review' : '');
  $('qtext').innerHTML = Q.text || ''; $('qtext').classList.toggle('off', !Q.text);
  $('qfig').innerHTML = Q.fig || ''; $('qfig').classList.toggle('off', !Q.fig);
  const qe = $('question');
  qe.innerHTML = Q.expr || ''; qe.classList.toggle('off', !Q.expr);
  qe.classList.toggle('mid', !!Q.expr && strip(Q.expr).length > 11);
  const box = $('choices'); box.innerHTML = '';
  const maxLen = Math.max(...Q.choices.map(c => strip(c).length));
  box.className = 'choices' + (maxLen > 5 ? ' long' : '') + (maxLen > 10 ? ' one' : '');
  Q.choices.forEach((c,i) => {
    const btn = document.createElement('button');
    btn.className = 'choice'; btn.id = 'choice'+i; btn.dataset.i = i;
    btn.innerHTML = `<span class="key">${i+1}</span>${c}`;
    btn.addEventListener('click', () => answer(btn));
    box.appendChild(btn);
  });
  $('feedback').textContent = '답을 누르거나 키보드 숫자로 골라요';
  $('okBtn').classList.add('off');
  $('quiz').classList.remove('off');
  $('quiz').scrollTop = 0;
  if(finePointer()) setTimeout(() => { const f = $('choice0'); f && f.focus({preventScroll:true}); }, 30);
}
function answer(btn){
  if(!quiz || quiz.locked) return;
  quiz.locked = true;
  const {Q, k, gain:base} = quiz;
  const chosen = Q.choices[+btn.dataset.i];
  const all = [...document.querySelectorAll('.choice')];
  all.forEach(x => x.disabled = true);
  const blank = $('question').querySelector('.ans');
  if(blank) blank.innerHTML = Q.ansShow != null ? Q.ansShow : Q.ans;
  if(chosen === Q.ans){
    btn.classList.add('right');
    streak++; S.solved++; S.best = Math.max(S.best, streak);
    const bonus = streak % 5 === 0, gain = base + (bonus ? 20 : 0);
    sfx.right(); setMood('happy'); anim('cheer');
    flyCoins(btn, Math.min(6, Math.round(gain/10)));
    $('feedback').innerHTML = bonus ? `<b>${streak}연속 정답! 보너스 20개</b>` : `<b>${pick(CHEERS)}</b> 동전 ${gain}개`;
    if(bonus){ const c = document.createElement('div'); c.className = 'combo'; c.textContent = streak + '연속!'; $('qcard').appendChild(c); setTimeout(() => c.remove(), 1300); }
    setTimeout(() => { S.coins += gain; renderCoins(true); save(); }, 550);
    setTimeout(() => {
      closeQuiz();
      G.cells[k].t = 'done'; renderCell(k, true);
      renderStatus(); renderShop();
      const left = boxesLeft();
      say(left ? `상자 열기 성공! 남은 상자 ${left}개.` : '마지막 상자까지 다 열었어!');
      if(!left) setTimeout(stageClear, 500);
    }, bonus ? 1500 : 1150);
  } else {
    btn.classList.add('wrong');
    all.find(x => Q.choices[+x.dataset.i] === Q.ans).classList.add('right');
    streak = 0; sfx.wrong(); setMood('sad'); anim('shake');
    try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
    if(S.review.length < 20) S.review.push(Q);
    quiz.wrong = true;
    $('feedback').innerHTML = `<b>아깝다! 정답은 ${Q.ans}</b><span class="explain">${Q.explain}</span>`;
    $('okBtn').classList.remove('off');
    if(finePointer()) setTimeout(() => $('okBtn').focus({preventScroll:true}), 30);
    save();
  }
  renderStatus();
}
$('okBtn').addEventListener('click', () => {
  if(!quiz || !quiz.wrong) return;
  closeQuiz();
  G.pos = {...G.prev}; placePanda(); anim('hop');
  renderStatus();
  say('괜찮아! 상자에 다시 들어가면 새 문제가 나와. 틀린 문제는 나중에 또 나올 거야.');
});
function closeQuiz(){ quiz = null; $('quiz').classList.add('off'); }
function stageClear(){
  const bonus = 20 + S.stage*5;
  S.coins += bonus; renderCoins(true);
  sfx.clear(); setMood('happy'); anim('cheer');
  $('clearTitle').textContent = S.stage + '단계 통과!';
  const harder = lvOf(S.stage+1) > lvOf(S.stage);
  $('clearText').textContent = `보너스 동전 ${bonus}개를 받았어. ${harder ? '다음 단계부터는 문제가 조금 더 어려워져!' : '다음 단계도 힘내자!'}`;
  $('clear').classList.remove('off');
  S.stage++; S.topStage = Math.max(S.topStage, S.stage); save();
  renderShop();
  if(finePointer()) setTimeout(() => $('nextBtn').focus({preventScroll:true}), 30);
}
function goNext(){ if($('clear').classList.contains('off')) return; $('clear').classList.add('off'); newStage(); }
$('nextBtn').addEventListener('click', goNext);
$('clear').addEventListener('click', e => { if(e.target === $('clear')) goNext(); });

/* ---------- units ---------- */
function renderUnits(){
  const box = $('units'); box.innerHTML = '';
  UNITS.forEach(u => {
    const b = document.createElement('button');
    b.className = 'tbl'; b.id = 'unit-' + u.id; b.textContent = u.name;
    b.setAttribute('aria-pressed', S.units.includes(u.id));
    b.addEventListener('click', () => {
      if(S.units.includes(u.id)){
        if(S.units.length === 1){ say('적어도 한 단원은 골라야 해!'); return; }
        S.units = S.units.filter(x => x !== u.id);
      } else S.units = ALL_UNITS.filter(x => x === u.id || S.units.includes(x));
      renderUnits(); save();
    });
    box.appendChild(b);
  });
  const all = document.createElement('button');
  all.className = 'tbl'; all.id = 'unit-all'; all.textContent = '전체';
  all.setAttribute('aria-pressed', S.units.length === ALL_UNITS.length);
  all.addEventListener('click', () => { S.units = ALL_UNITS.slice(); renderUnits(); save(); });
  box.appendChild(all);
}

/* ---------- shop ---------- */
function renderShop(){
  const box = $('shop'); box.innerHTML = '';
  ITEMS.forEach(it => {
    const own = !!S.owned[it.id], on = S.equip[it.slot] === it.id;
    const row = document.createElement('div');
    row.className = 'item' + (on ? ' equipped' : '');
    row.innerHTML = it.icon + '<span class="nm"></span>';
    row.querySelector('.nm').textContent = it.name;
    const btn = document.createElement('button'); btn.id = 'buy-' + it.id;
    if(!own){
      const poor = S.coins < it.price;
      btn.innerHTML = `<span class="mini"></span>${it.price} ${poor ? '' : '사기'}`;
      btn.className = poor ? 'poor' : '';
      btn.setAttribute('aria-label', `${it.name} 동전 ${it.price}개로 사기` + (poor ? ' (동전 부족)' : ''));
      btn.addEventListener('click', () => {
        if(S.coins < it.price){ say(`${it.name}을(를) 사려면 동전 ${it.price}개가 필요해. 지금 ${S.coins}개 있어.`); return; }
        S.coins -= it.price; S.owned[it.id] = true; S.equip[it.slot] = it.id;
        sfx.buy(); setMood('happy'); anim('cheer'); say(`${it.name} 고마워! 잘 어울려?`);
        renderCoins(true); renderPanda(); renderShop(); save();
      });
    } else {
      btn.textContent = on ? '입는 중' : '입기';
      btn.className = on ? 'on' : 'wear';
      btn.setAttribute('aria-pressed', on);
      btn.addEventListener('click', () => {
        S.equip[it.slot] = on ? null : it.id;
        if(!on){ setMood('happy'); anim('cheer'); }
        renderPanda(); renderShop(); save();
      });
    }
    row.appendChild(btn); box.appendChild(row);
  });
  // red dot on the shop button when something new can be bought
  $('shopDot').classList.toggle('off', !ITEMS.some(it => !S.owned[it.id] && S.coins >= it.price));
}

/* ---------- bottom sheets ---------- */
let openSheet = null;
function showSheet(id){
  walkQ = [];
  openSheet = id;
  $(id).classList.remove('off'); $('sheetBack').classList.remove('off');
  $(id).scrollTop = 0;
  if(finePointer()) setTimeout(() => { const c = $(id).querySelector('[data-close]'); c && c.focus({preventScroll:true}); }, 30);
}
function hideSheet(){
  if(!openSheet) return;
  const back = openSheet === 'unitSheet' ? 'openUnits' : 'openShop';
  $(openSheet).classList.add('off'); $('sheetBack').classList.add('off');
  openSheet = null;
  if(finePointer()) $(back).focus({preventScroll:true});
}
$('openUnits').addEventListener('click', () => { if(!quiz) showSheet('unitSheet'); });
$('openShop').addEventListener('click', () => { if(!quiz) showSheet('shopSheet'); });
$('sheetBack').addEventListener('click', hideSheet);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', hideSheet));

/* ---------- swipe on the map ---------- */
let swipedAt = 0, touchStart = null;
$('board').addEventListener('pointerdown', e => { touchStart = {x:e.clientX, y:e.clientY}; });
$('board').addEventListener('pointercancel', () => { touchStart = null; });
$('board').addEventListener('pointerup', e => {
  if(!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  touchStart = null;
  const dist = Math.max(Math.abs(dx), Math.abs(dy));
  if(dist < 24 || busy()) return;
  swipedAt = performance.now();
  const cell = $('board').getBoundingClientRect().width / N;
  const steps = Math.max(1, Math.min(N-1, Math.round(dist / cell)));
  const [sx, sy] = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  if(sx) G.flip = sx < 0;
  const path = [];
  let x = G.pos.x, y = G.pos.y;
  for(let i=0;i<steps;i++){
    x += sx; y += sy;
    if(!canEnter(x,y)) break;
    path.push([x,y]);
    const t = G.cells[idx(x,y)].t;
    if(t === 'box' || t === 'star') break;
  }
  if(!path.length){ tryMove(sx, sy); return; }
  walkQ = path;
  if(!walking) walkLoop();
});

/* ---------- d-pad: tap to step, hold to keep walking ---------- */
function holdButton(id, dx, dy){
  const b = $(id); let timer = null, viaPointer = false;
  const stop = () => { clearInterval(timer); timer = null; b.classList.remove('held'); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); viaPointer = true;
    lastMove = 0; tryMove(dx, dy);
    b.classList.add('held');
    clearInterval(timer);
    timer = setInterval(() => { if(busy()) return stop(); lastMove = 0; tryMove(dx, dy); }, 190);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('click', () => { if(viaPointer){ viaPointer = false; return; } tryMove(dx, dy); });
  b.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- input ---------- */
holdButton('mvU', 0, -1);
holdButton('mvD', 0, 1);
holdButton('mvL', -1, 0);
holdButton('mvR', 1, 0);
document.addEventListener('keydown', e => {
  if(openSheet){ if(e.key === 'Escape'){ e.preventDefault(); hideSheet(); } return; }
  if(quiz){
    if(quiz.wrong && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')){ e.preventDefault(); $('okBtn').click(); return; }
    const i = +e.key - 1;
    if(i >= 0 && i < 4){ const b = $('choice'+i); if(b && !b.disabled) b.click(); }
    return;
  }
  if(!$('clear').classList.contains('off')){
    if(e.key === 'Escape' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goNext(); }
    return;
  }
  const map = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  const m = map[e.key];
  if(m && !e.target.closest('.shop, .units')){ e.preventDefault(); tryMove(...m); }
});
$('soundBtn').addEventListener('click', () => { sound = !sound; applySound(); try{ localStorage.setItem(KEY+'-sound', sound ? '1' : '0'); }catch(e){} });
function applySound(){
  $('muteX').classList.toggle('off', sound);
  $('waveA').classList.toggle('off', !sound); $('waveB').classList.toggle('off', !sound);
  $('soundBtn').setAttribute('aria-label', sound ? '소리 끄기' : '소리 켜기');
}

function start(data){
  S = data && data.S ? data.S : load();
  // review items from older versions were plain [a,b] pairs
  S.review = (S.review || []).filter(q => q && !Array.isArray(q) && q.choices && q.ans);
  if(!Array.isArray(S.units) || !S.units.length) S.units = ALL_UNITS.slice();
  S.units = S.units.filter(id => ALL_UNITS.includes(id));
  if(!S.units.length) S.units = ALL_UNITS.slice();
  streak = (data && data.streak) || 0;
  try{ if(localStorage.getItem(KEY+'-sound') === '0') sound = false; }catch(e){}
  applySound();
  renderCoins(); renderPanda(); renderShop(); renderUnits();
  if(data && data.G){ G = data.G; renderBoard(); placePanda(true); renderStatus(); say('계속 탐험하자!'); }
  else newStage();
  if(S.solved > 0 && !(data && data.G)) say(`다시 왔구나! ${S.stage}단계부터 이어서 하자. ? 상자를 찾아가 봐!`);
  window.claude?.hot?.snapshot?.(() => ({S, G, streak}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
